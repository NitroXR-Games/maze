<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NitroXR Maze - Debug Viewer</title>
    <style>
        html, body {
            background: #121212;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* 3D canvas owns the full window; never a flex item (flex would
           stretch the image and desync visuals from the logical grid). */
        body > canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #console {
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            width: min(80%, 900px);
            height: 22vh;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff41;
            padding: 12px 16px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            z-index: 20;
        }
        #console.hidden { display: none; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #003300; padding-bottom: 2px; }
        .header {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .header h1 { margin: 0 0 6px 0; font-size: 1.1rem; }
        .hint { font-size: 0.7rem; opacity: 0.7; margin-top: 4px; }
        .status-pill {
            background: #00ff41;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NITROXR MAZE DEBUGGER</h1>
        <span class="status-pill">LIVE RUNTIME (cloud.nitroxr.com)</span>
        <div class="hint">V — change view &nbsp;·&nbsp; ` — toggle console</div>
    </div>
    <div id="console"></div>

    <script>
        // Redirect console.log to the screen for easy viewing
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        console.log = function(...args) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            originalLog.apply(console, args);
        };
        // Backquote toggles the console drawer. The game keys (WASD/T/...)
        // never collide with it.
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Backquote') consoleDiv.classList.toggle('hidden');
        });
    </script>
    <script type="module" src="./maze.js"></script>
</body>
</html>
