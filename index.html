<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NitroXR Maze - Debug Viewer</title>
    <style>
        body {
            background: #121212;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #console {
            width: 80%;
            height: 60%;
            background: #000;
            border: 2px solid #00ff41;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #003300; padding-bottom: 2px; }
        .header { margin-bottom: 20px; text-align: center; }
        .status-pill {
            background: #00ff41;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NITROXR MAZE DEBUGGER</h1>
        <span class="status-pill">LIVE RUNTIME (cloud.nitroxr.com)</span>
    </div>
    <div id="console"></div>

    <script>
        // Redirect console.log to the screen for easy viewing
        const consoleDiv = document.getElementById('console');
        const originalLog = console.log;
        console.log = function(...args) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            originalLog.apply(console, args);
        };
    </script>
    <script type="module" src="./maze.js"></script>
</body>
</html>
