<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NitroXR Maze - Debug Viewer</title>
    <style>
        html, body {
            background: #121212;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* 3D canvas owns the full window; never a flex item (flex would
           stretch the image and desync visuals from the logical grid). */
        body > canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #console {
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            width: min(80%, 900px);
            height: 22vh;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ff41;
            padding: 12px 16px;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            z-index: 20;
        }
        #console.hidden { display: none; }
        #console-toggle {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 30;
            background: rgba(0, 0, 0, 0.6);
            color: #00ff41;
            border: 1px solid #00ff41;
            border-radius: 6px;
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            cursor: pointer;
        }
        #console-toggle:hover { background: rgba(0, 255, 65, 0.15); }
        #console-toggle.active { background: #00ff41; color: #000; }
        #log-count {
            display: none;
            margin-left: 6px;
            padding: 0 5px;
            border-radius: 10px;
            background: #00ff41;
            color: #000;
        }
        #console-toggle.active #log-count { background: #000; color: #00ff41; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #003300; padding-bottom: 2px; }
        .header {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .header h1 { margin: 0 0 6px 0; font-size: 1.1rem; }
        .hint { font-size: 0.7rem; opacity: 0.7; margin-top: 4px; }
        .status-pill {
            background: #00ff41;
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>NITROXR MAZE DEBUGGER</h1>
        <span class="status-pill">LIVE RUNTIME (cloud.nitroxr.com)</span>
        <div class="hint">V — change view &nbsp;·&nbsp; / — toggle console</div>
    </div>
    <button id="console-toggle" type="button" title="Toggle console (/)">LOG <span id="log-count">0</span></button>
    <div id="console" class="hidden"></div>

    <script>
        // On-screen console mirror. Starts collapsed so it never covers the
        // maze, with a clickable toggle plus / and ` (backtick) as keys —
        // plenty of keyboards hide the backtick behind Fn, so the button and
        // / are the reliable paths.
        const consoleDiv = document.getElementById('console');
        const toggleBtn = document.getElementById('console-toggle');
        const logCount = document.getElementById('log-count');
        const originalLog = console.log;
        const MAX_ENTRIES = 200; // cap the mirror so a chatty loop can't grow it forever
        let unread = 0;

        function setConsoleOpen(open) {
            consoleDiv.classList.toggle('hidden', !open);
            if (open) unread = 0;
            logCount.textContent = unread;
            logCount.style.display = unread ? 'inline' : 'none';
            toggleBtn.classList.toggle('active', open);
        }

        console.log = function(...args) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${args.join(' ')}`;
            consoleDiv.appendChild(entry);
            while (consoleDiv.childElementCount > MAX_ENTRIES) {
                consoleDiv.removeChild(consoleDiv.firstElementChild);
            }
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
            if (consoleDiv.classList.contains('hidden')) {
                unread++;
                logCount.textContent = unread;
                logCount.style.display = 'inline';
            }
            originalLog.apply(console, args);
        };

        toggleBtn.addEventListener('click', () => setConsoleOpen(consoleDiv.classList.contains('hidden')));
        // Game keys (WASD/Q/E/C/T/V) never collide with these.
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Backquote' || e.code === 'Slash') {
                setConsoleOpen(consoleDiv.classList.contains('hidden'));
            }
        });
    </script>
    <script type="module" src="./maze.js"></script>
</body>
</html>
