# Build the maze bundle and deploy it to GitHub Pages.
# Flow: push to main (or manual run) -> npm ci -> esbuild bundle ->
# artifact {index.html, maze.js, config.json} -> github-pages environment.
# Local dev mirrors this: `npm run build`, then serve the repo root.

name: Deploy maze to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Smoke test (live cloud)
        run: npm test

      - name: Build browser bundle
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp dist/maze.js site/maze.js
          cp config.json site/config.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
